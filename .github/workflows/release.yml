name: Create GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog section
        id: changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"   # strip leading 'v'
          # Extract the block between ## [version] and the next ---
          notes=$(awk "
            /^## \[${version}\]/ { found=1; next }
            found && /^---/ { exit }
            found { print }
          " CHANGELOG.md | sed '/^[[:space:]]*$/{ /./!d }' | sed '1{/^[[:space:]]*$/d}')

          if [ -z "$notes" ]; then
            notes="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          fi

          # Write to a temp file to preserve newlines
          echo "$notes" > /tmp/release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md
